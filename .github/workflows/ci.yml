name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.formula }} / ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            formula: slack-axi
          - runner: macos-15-intel
            architecture: x86_64
            formula: slack-axi
          - runner: macos-15
            architecture: arm64
            formula: cookidoo-axi
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Link this checkout as the tap
        shell: bash
        run: |
          set -euo pipefail
          tap_parent="$(brew --repository)/Library/Taps/aimlesx"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-tap"

      - run: brew audit --strict --online "aimlesx/tap/${{ matrix.formula }}"
      - run: brew install --build-from-source "aimlesx/tap/${{ matrix.formula }}"
      - run: brew test "aimlesx/tap/${{ matrix.formula }}"
